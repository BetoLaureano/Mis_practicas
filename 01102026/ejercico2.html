<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Alta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        /* Título principal centrado */
        h1 {
            text-align: center;
        }

        /* Recuadro exterior con borde punteado */
        .marco-formulario {
            border: 1px dashed #888888;
            padding: 25px 35px;
            max-width: 720px;
            margin: 20px auto;
        }

        /* Crea la estructura de 2 columnas */
        .columnas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 40px;
        }

        /* Asterisco de color rojo */
        .asterisco {
            color: red;
        }

        /* Espaciado para cada grupo de campo */
        .grupo-campo {
            margin-bottom: 12px;
        }

        .grupo-campo input[type="text"],
        .grupo-campo input[type="email"] {
            width: 100%;
            box-sizing: border-box;
        }

        /* Etiqueta explicativa debajo del campo */
        .texto-debajo {
            display: block;
            font-size: 0.8em;
            color: #333333;
            margin-top: 2px;
        }

        /* Coloca elementos de la misma sección lado a lado (Provincia/País y Fijo/Móvil) */
        .campos-paralelos {
            display: flex;
            gap: 10px;
        }

        .campos-paralelos > div {
            flex: 1;
        }

        .campos-paralelos select,
        .campos-paralelos input {
            width: 100%;
            box-sizing: border-box;
        }

        /* Botón de envío */
        .btn-enviar {
            margin-top: 20px;
            padding: 3px 12px;
        }
    </style>
</head>
<body>

    <h1>Formulario de Alta</h1>

    <div class="marco-formulario">
        <form action="#" method="post">
            
            <div class="columnas">
                
                <!-- Columna Izquierda: Nombre y Apellidos -->
                <div>
                    <h3>Nombre y apellidos <span class="asterisco">*</span></h3>
                    
                    <div class="grupo-campo">
                        <input type="text" name="nombre">
                        <span class="texto-debajo">Nombre</span>
                    </div>

                    <div class="grupo-campo">
                        <input type="text" name="primer_apellido">
                        <span class="texto-debajo">Primer apellido</span>
                    </div>

                    <div class="grupo-campo">
                        <input type="text" name="segundo_apellido">
                        <span class="texto-debajo">Segundo apellido</span>
                    </div>
                </div>

                <!-- Columna Derecha: Dirección -->
                <div>
                    <h3>Dirección <span class="asterisco">*</span></h3>

                    <div class="grupo-campo">
                        <input type="text" name="direccion">
                        <span class="texto-debajo">Calle, número, piso, puerta</span>
                    </div>

                    <div class="grupo-campo">
                        <input type="text" name="cp">
                        <span class="texto-debajo">Código postal</span>
                    </div>

                    <div class="grupo-campo">
                        <input type="text" name="municipio">
                        <span class="texto-debajo">Municipio</span>
                    </div>

                    <div class="campos-paralelos">
                        <div>
                            <select name="provincia">
                                <option value=""></option>
                            </select>
                            <span class="texto-debajo">Provincia</span>
                        </div>
                        <div>
                            <select name="pais">
                                <option value=""></option>
                            </select>
                            <span class="texto-debajo">País</span>
                        </div>
                    </div>
                </div>

                <!-- Columna Izquierda: Email -->
                <div>
                    <h3>Email <span class="asterisco">*</span></h3>
                    <div class="grupo-campo">
                        <input type="email" name="email">
                    </div>
                </div>

                <!-- Columna Derecha: Teléfono -->
                <div>
                    <h3>Teléfono <span class="asterisco">*</span></h3>
                    <div class="campos-paralelos">
                        <div>
                            <input type="tel" name="fijo">
                            <span class="texto-debajo">Fijo</span>
                        </div>
                        <div>
                            <input type="tel" name="movil">
                            <span class="texto-debajo">Móvil</span>
                        </div>
                    </div>
                </div>

            </div>

            <input type="submit" class="btn-enviar" value="Enviar">

        </form>
    </div>

</body>
</html>
